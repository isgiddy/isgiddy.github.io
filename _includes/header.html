<header class="site-header">
  <meta name="google-site-verification" content="ZzIzQVB3ZLRMTiUGhiDbNfSSGHrAfr3pIz5BX3Djuxo" />
  <nav class="group">
    <!-- Logo / Home link -->
    <a class="brand" href="{{ site.baseurl }}/">
      <img class="badge" src="{{ site.baseurl }}/assets/img/profile_badge.jpg" alt="Isabelle Giddy">
      <span class="brand-name">Isabelle Giddy</span>
    </a>

    <!-- Burger Button -->
    <a id="togglemenu" onclick="document.body.classList.toggle('menuopen');" aria-label="Toggle navigation" tabindex="0">
      <span class="burger">
        <span></span>
        <span></span>
        <span></span>
      </span>
    </a>

    <!-- Navigation Links -->
    <div id="menu">
      {% assign ordered_pages = site.pages | sort: "order" %}
      {% for nav_page in ordered_pages %}
        {% unless nav_page.nav_exclude %}
          {% if nav_page.title and nav_page.order %}
            <a href="{{ nav_page.url | prepend: site.baseurl }}"
               class="{% if page.url == nav_page.url %}active{% endif %}">{{ nav_page.nav_title | default: nav_page.title }}</a>
          {% endif %}
        {% endunless %}
      {% endfor %}
    </div>
  </nav>
</header>
